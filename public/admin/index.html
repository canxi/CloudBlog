<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - CloudBlog</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #3b82f6; --bg: #f8fafc; --surface: #fff; --text: #0f172a; --text-sec: #64748b; --border: #e2e8f0; --danger: #ef4444; --success: #10b981; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    a { color: var(--primary); text-decoration: none; }

    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 64px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .header-left h1 { font-size: 16px; font-weight: 700; }
    .header-left a { font-size: 14px; color: var(--text-sec); }
    .header-left a:hover { color: var(--primary); }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .user-info { font-size: 13px; color: var(--text-sec); padding-right: 8px; border-right: 1px solid var(--border); margin-right: 4px; }
    .logout-btn { padding: 7px 16px; background: #f1f5f9; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; }

    main { max-width: 960px; margin: 0 auto; padding: 32px 24px; }

    .page-title { font-size: 22px; font-weight: 700; margin-bottom: 24px; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .stat-card .label { font-size: 13px; color: var(--text-sec); margin-bottom: 6px; }
    .stat-card .value { font-size: 28px; font-weight: 700; }

    .section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 24px; }
    .section-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .section-header h2 { font-size: 15px; font-weight: 600; }
    .tab-bar { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--border); }
    .tab { padding: 12px 16px; font-size: 13px; font-weight: 500; color: var(--text-sec); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

    .comment-item { display: flex; gap: 16px; padding: 16px 20px; border-bottom: 1px solid var(--border); align-items: flex-start; }
    .comment-item:last-child { border-bottom: none; }
    .comment-avatar { width: 36px; height: 36px; border-radius: 50%; background: #f1f5f9; flex-shrink: 0; }
    .comment-body { flex: 1; min-width: 0; }
    .comment-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
    .comment-author { font-weight: 600; font-size: 13px; }
    .comment-time { font-size: 12px; color: var(--text-sec); }
    .comment-post { font-size: 12px; color: var(--primary); background: #eff6ff; padding: 2px 8px; border-radius: 10px; }
    .comment-content { font-size: 13px; color: var(--text); line-height: 1.5; margin-bottom: 8px; word-break: break-word; }
    .comment-actions { display: flex; gap: 6px; }
    .action-btn { padding: 4px 10px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 500; }
    .approve-btn { background: #dcfce7; color: #166534; }
    .spam-btn { background: #fef3c7; color: #92400e; }
    .delete-btn { background: #fee2e2; color: #991b1b; }
    .status-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-approved { background: #dcfce7; color: #166534; }
    .status-spam { background: #fee2e2; color: #991b1b; }

    .empty-state { text-align: center; padding: 40px; color: var(--text-sec); font-size: 14px; }
    .loading { text-align: center; padding: 40px; color: var(--text-sec); font-size: 14px; }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #0f172a; color: white; padding: 10px 24px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 200; white-space: nowrap; }
    .toast.show { opacity: 1; }

    .post-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--border); }
    .post-item:last-child { border-bottom: none; }
    .post-info .post-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .post-info .post-meta { font-size: 12px; color: var(--text-sec); }
    .post-actions { display: flex; gap: 6px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Password modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 300; padding: 20px; }
    .modal-overlay.hidden { display: none; }
    .modal { background: white; border-radius: 12px; padding: 24px; width: 100%; max-width: 380px; }
    .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 10px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: inherit; }
    .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
    .modal-actions button { flex: 1; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .modal-actions .cancel-btn { background: #f1f5f9; border: 1px solid var(--border); color: var(--text-sec); }
    .modal-actions .save-btn { background: var(--primary); border: none; color: white; }
    .modal-actions .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .modal-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; border-radius: 6px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; display: none; }
    .modal-error.show { display: block; }
    .change-pw-btn { padding: 7px 16px; background: white; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .change-pw-btn:hover { background: #f8fafc; }
  </style>
</head>
<body>
<header>
  <div class="header-left">
    <h1>CloudBlog 管理后台</h1>
    <a href="/">← 返回博客</a>
  </div>
  <div class="header-right">
    <span class="user-info" id="userInfo">加载中...</span>
    <button class="change-pw-btn" onclick="openPasswordModal()">修改密码</button>
    <button class="logout-btn" onclick="logout()">退出</button>
  </div>
</header>

<main>
  <h2 class="page-title">概览</h2>
  <div class="stats">
    <div class="stat-card">
      <div class="label">文章总数</div>
      <div class="value" id="statPosts">-</div>
    </div>
    <div class="stat-card">
      <div class="label">待审评论</div>
      <div class="value" id="statPending">-</div>
    </div>
    <div class="stat-card">
      <div class="label">已发布</div>
      <div class="value" id="statApproved">-</div>
    </div>
    <div class="stat-card">
      <div class="label">垃圾评论</div>
      <div class="value" id="statSpam">-</div>
    </div>
  </div>

  <div class="section">
    <div class="tab-bar">
      <div class="tab active" onclick="switchTab('comments', this)">评论管理</div>
      <div class="tab" onclick="switchTab('posts', this)">文章管理</div>
    </div>

    <div id="tab-comments" class="tab-content active">
      <div id="commentsLoading" class="loading">加载中...</div>
      <div id="commentsList"></div>
    </div>

    <div id="tab-posts" class="tab-content">
      <div id="postsLoading" class="loading">加载中...</div>
      <div id="postsList"></div>
    </div>
  </div>
</main>

<!-- Password Change Modal -->
<div class="modal-overlay hidden" id="passwordModal">
  <div class="modal">
    <h3>修改密码</h3>
    <div class="modal-error" id="pwError"></div>
    <div class="form-group">
      <label for="currentPw">当前密码</label>
      <input type="password" id="currentPw" autocomplete="current-password">
    </div>
    <div class="form-group">
      <label for="newPw">新密码（至少6位）</label>
      <input type="password" id="newPw" autocomplete="new-password">
    </div>
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closePasswordModal()">取消</button>
      <button class="save-btn" id="savePwBtn" onclick="savePassword()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // --完成: 强制改密 - 首次登录必须修改密码 --
  function getSession() {
    const s = localStorage.getItem('cloudblog_session');
    return s ? JSON.parse(s) : null;
  }

  function requireAuth() {
    if (!getSession()) {
      window.location.href = '/admin/login.html';
      return false;
    }
    return true;
  }

  // Check if user must change password - force overlay if required
  function checkMustChangePassword() {
    const session = getSession();
    if (session && session.must_change_password) {
      // Show forced password change overlay
      document.getElementById('passwordModal').classList.remove('hidden');
      // Prevent closing without changing password
      document.getElementById('passwordModal').querySelector('.modal-actions .cancel-btn').style.display = 'none';
      return true;
    }
    return false;
  }

  function logout() {
    fetch('/api/auth/logout', { method: 'POST' }).catch(() => {});
    localStorage.removeItem('cloudblog_session');
    window.location.href = '/admin/login.html';
  }

  async function apiFetch(url, options = {}) {
    const session = getSession();
    const res = await fetch(url, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        ...options.headers,
      },
      credentials: 'include',
    });
    if (res.status === 401) {
      logout();
      throw new Error('Unauthorized');
    }
    return res;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function switchTab(name, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('tab-' + name).classList.add('active');
    if (name === 'posts' && !window.postsLoaded) {
      window.postsLoaded = true;
      loadPosts();
    }
  }

  function openPasswordModal() {
    document.getElementById('passwordModal').classList.remove('hidden');
    document.getElementById('pwError').classList.remove('show');
    document.getElementById('currentPw').value = '';
    document.getElementById('newPw').value = '';
  }

  function closePasswordModal() {
    document.getElementById('passwordModal').classList.add('hidden');
  }

  async function savePassword() {
    const currentPw = document.getElementById('currentPw').value;
    const newPw = document.getElementById('newPw').value;
    const errorEl = document.getElementById('pwError');
    const btn = document.getElementById('savePwBtn');

    if (!currentPw || !newPw) {
      errorEl.textContent = '请填写所有字段';
      errorEl.classList.add('show');
      return;
    }

    if (newPw.length < 6) {
      errorEl.textContent = '新密码至少6位';
      errorEl.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.textContent = '保存中...';

    try {
      const res = await fetch('/api/auth/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ currentPassword: currentPw, newPassword: newPw }),
        credentials: 'include',
      });

      const data = await res.json();

      if (res.ok) {
        showToast('密码修改成功');
        closePasswordModal();
        // --完成: 强制改密 - 清除 session 中的 must_change_password 标志 --
        const session = getSession();
        if (session) {
          session.must_change_password = false;
          localStorage.setItem('cloudblog_session', JSON.stringify(session));
        }
        // Restore cancel button for future voluntary changes
        const cancelBtn = document.querySelector('#passwordModal .modal-actions .cancel-btn');
        if (cancelBtn) cancelBtn.style.display = '';
      } else {
        errorEl.textContent = data.error || '修改失败';
        errorEl.classList.add('show');
      }
    } catch (e) {
      errorEl.textContent = '网络错误，请重试';
      errorEl.classList.add('show');
    }

    btn.disabled = false;
    btn.textContent = '保存';
  }

  // ── Stats ──
  async function loadStats() {
    try {
      const [postsRes, commentsRes] = await Promise.all([
        fetch('/api/posts'),
        apiFetch('/api/admin/comments')
      ]);
      const postsData = postsRes.ok ? await postsRes.json() : { posts: [] };
      const commentsData = commentsRes.ok ? await commentsRes.json() : { comments: [] };
      const comments = commentsData.comments || [];

      document.getElementById('statPosts').textContent = (postsData.posts || []).length;
      document.getElementById('statPending').textContent = comments.filter(c => c.status === 'pending').length;
      document.getElementById('statApproved').textContent = comments.filter(c => c.status === 'approved').length;
      document.getElementById('statSpam').textContent = comments.filter(c => c.status === 'spam').length;
    } catch (e) {}
  }

  // ── Comments ──
  async function loadComments() {
    const container = document.getElementById('commentsList');
    const loading = document.getElementById('commentsLoading');
    loading.style.display = 'block';
    container.innerHTML = '';

    try {
      const res = await apiFetch('/api/admin/comments');
      const data = await res.json();
      const comments = data.comments || [];
      loading.style.display = 'none';

      if (comments.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无评论</div>';
        return;
      }

      container.innerHTML = comments.map(c => `
        <div class="comment-item" id="comment-${c.id}">
          <div class="comment-avatar"></div>
          <div class="comment-body">
            <div class="comment-meta">
              <span class="comment-author">${escapeHtml(c.author)}</span>
              <span class="comment-time">${formatTime(c.createdAt)}</span>
              <span class="comment-post">${escapeHtml(c.postSlug)}</span>
              <span class="status-badge status-${c.status}">${c.status === 'pending' ? '待审' : c.status === 'approved' ? '已发布' : '垃圾'}</span>
            </div>
            <div class="comment-content">${escapeHtml(c.content)}</div>
            <div class="comment-actions">
              ${c.status !== 'approved' ? `<button class="action-btn approve-btn" onclick="moderateComment('${c.id}', 'approved')">通过</button>` : ''}
              ${c.status !== 'spam' ? `<button class="action-btn spam-btn" onclick="moderateComment('${c.id}', 'spam')">标记垃圾</button>` : ''}
              <button class="action-btn delete-btn" onclick="deleteComment('${c.id}')">删除</button>
            </div>
          </div>
        </div>
      `).join('');
    } catch (e) {
      loading.style.display = 'none';
      container.innerHTML = '<div class="empty-state">加载失败，请重试</div>';
    }
  }

  async function moderateComment(id, status) {
    try {
      const res = await apiFetch(`/api/admin/comments/${id}`, {
        method: 'PATCH',
        body: JSON.stringify({ status })
      });
      if (res.ok) {
        showToast('操作成功');
        loadComments();
        loadStats();
      } else {
        showToast('操作失败');
      }
    } catch (e) {
      showToast('操作失败');
    }
  }

  async function deleteComment(id) {
    if (!confirm('确定删除这条评论？')) return;
    try {
      const res = await apiFetch(`/api/admin/comments/${id}`, { method: 'DELETE' });
      if (res.ok) {
        document.getElementById('comment-' + id)?.remove();
        showToast('已删除');
        loadStats();
      } else {
        showToast('删除失败');
      }
    } catch (e) {
      showToast('删除失败');
    }
  }

  async function deletePost(slug) {
    if (!confirm('确定删除这篇文章？此操作不可恢复。')) return;
    try {
      const res = await apiFetch(`/api/posts/${encodeURIComponent(slug)}`, { method: 'DELETE' });
      if (res.ok) {
        showToast('已删除');
        loadPosts();
        loadStats();
      } else {
        const data = await res.json();
        showToast(data.error || '删除失败');
      }
    } catch (e) {
      showToast('删除失败');
    }
  }

  // ── Posts ──
  async function loadPosts() {
    const container = document.getElementById('postsList');
    const loading = document.getElementById('postsLoading');
    loading.style.display = 'block';
    container.innerHTML = '';

    try {
      const res = await apiFetch('/api/admin/posts');
      const data = await res.json();
      const posts = data.posts || [];
      loading.style.display = 'none';

      if (posts.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无文章</div>';
        return;
      }

      container.innerHTML = posts.map(p => `
        <div class="post-item">
          <div class="post-info">
            <div class="post-title">${escapeHtml(p.title)}</div>
            <div class="post-meta">${p.status === 'draft' ? '草稿' : '已发布'} · ${formatTime(p.createdAt)} · ${p.author?.name || 'Unknown'}</div>
          </div>
          <div class="post-actions">
            <a href="/posts/${p.slug}" class="action-btn" style="background:#eff6ff;color:#1e40af" target="_blank">查看</a>
            <a href="/write.html?edit=${encodeURIComponent(p.slug)}" class="action-btn" style="background:#f0fdf4;color:#166534">编辑</a>
            <button class="action-btn delete-btn" onclick="deletePost('${escapeHtml(p.slug)}')">删除</button>
          </div>
        </div>
      `).join('');
    } catch (e) {
      loading.style.display = 'none';
      container.innerHTML = '<div class="empty-state">加载失败</div>';
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatTime(ts) {
    if (!ts) return '';
    // Handle both Unix timestamps (seconds or ms) and ISO strings
    let d;
    if (typeof ts === 'string' || (typeof ts === 'number' && ts > 1e12)) {
      // ISO string or already in milliseconds
      d = new Date(ts);
    } else {
      // Unix timestamp in seconds
      d = new Date(ts * 1000);
    }
    if (isNaN(d.getTime())) return '';
    const now = new Date();
    const diff = now - d;
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
    if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
    return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
  }

  // ── Init ──
  if (!requireAuth()) {} else {
    const session = getSession();
    document.getElementById('userInfo').textContent = session?.username || 'Admin';

    // --完成: 强制改密 - 检查 URL 参数或 session 中的 must_change_password --
    const urlParams = new URLSearchParams(window.location.search);
    const forcePwChange = urlParams.get('force_pw_change') === '1';
    if (forcePwChange || checkMustChangePassword()) {
      // Force show password change modal, hide cancel button
      document.getElementById('passwordModal').classList.remove('hidden');
      const cancelBtn = document.querySelector('#passwordModal .modal-actions .cancel-btn');
      if (cancelBtn) cancelBtn.style.display = 'none';
    }

    loadStats();
    loadComments();
  }
</script>
</body>
</html>
