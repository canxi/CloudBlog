<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - CloudBlog</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: white; border-radius: 16px; padding: 36px 32px;
      width: 100%; max-width: 360px; box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .logo { font-size: 32px; text-align: center; margin-bottom: 6px; }
    h1 { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 4px; color: #0f172a; letter-spacing: -0.3px; }
    .subtitle { font-size: 13px; color: #64748b; text-align: center; margin-bottom: 24px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 11px 14px; border: 1.5px solid #e2e8f0;
      border-radius: 10px; font-size: 14px; font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fafbfc;
    }
    input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); background: white; }
    .btn { width: 100%; padding: 12px; background: #0f172a; color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 6px; }
    .btn:hover { background: #1e293b; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; display: none; }
    .error.show { display: block; }
    .back { display: block; text-align: center; margin-top: 16px; color: #64748b; text-decoration: none; font-size: 13px; }
    .back:hover { color: #3b82f6; }
    .default-hint {
      background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 8px;
      padding: 10px 14px; font-size: 12px; color: #0369a1; margin-bottom: 16px;
      display: none;
    }
    .default-hint strong { display: block; margin-bottom: 2px; }
    .default-hint.show { display: block; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">CloudBlog</div>
    <h1>管理登录</h1>
    <p class="subtitle">输入账号信息登录后台</p>
    
    <div class="default-hint" id="defaultHint">
      <strong>默认管理员账号</strong>
      用户名：admin &nbsp;|&nbsp; 密码：admin123
    </div>

    <div class="error" id="error"></div>
    <div class="form-group">
      <label for="username">用户名</label>
      <input type="text" id="username" placeholder="输入用户名" autofocus autocomplete="username">
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" placeholder="输入密码" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn" onclick="doLogin()">登录</button>
    <a href="/" class="back">← 返回博客首页</a>
  </div>

  <script>
    // If already logged in, redirect to dashboard
    if (localStorage.getItem('cloudblog_session')) {
      window.location.href = '/admin/index.html';
    }

    // Check if default admin password needs changing - only show hint if must_change_password is true
    (async function checkAuthStatus() {
      try {
        const res = await fetch('/api/auth/status');
        if (res.ok) {
          const data = await res.json();
          // Only show default hint if admin still needs to change password (fresh install not configured)
          if (data.mustChangePassword) {
            document.getElementById('defaultHint').classList.add('show');
          }
        }
      } catch (e) {
        // Silently fail - don't show hint if status check fails
      }
    })();

    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      const btn = document.getElementById('loginBtn');

      if (!username || !password) {
        errorEl.textContent = '请输入用户名和密码';
        errorEl.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = '登录中...';
      errorEl.classList.remove('show');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('cloudblog_session', JSON.stringify(data.user));
          const params = new URLSearchParams(window.location.search);
          const returnUrl = params.get('return_url');
          // --完成: 强制改密 - 如果必须修改密码，重定向到修改密码提示页 --
          if (data.user && data.user.must_change_password) {
            window.location.href = '/admin/index.html?force_pw_change=1';
          } else {
            window.location.href = returnUrl ? decodeURIComponent(returnUrl) : '/admin/index.html';
          }
        } else {
          errorEl.textContent = data.error || '登录失败，请重试';
          errorEl.classList.add('show');
          btn.disabled = false;
          btn.textContent = '登录';
        }
      } catch (e) {
        errorEl.textContent = '网络错误，请重试';
        errorEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = '登录';
      }
    }

    // Enter key to submit
    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
