<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写文章 - CloudBlog</title>
  <link rel="stylesheet" href="/github-markdown.min.css">
  <script src="/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; min-height: 100vh; }
    header {
      background: white; border-bottom: 1px solid #e5e5e5; padding: 0 20px;
      height: 56px; display: flex; align-items: center; justify-content: center;
      position: sticky; top: 0; z-index: 100;
    }
    .header-inner { width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; box-sizing: border-box; }
    .back-btn { text-decoration: none !important; }
    .header-brand { font-size: 16px; font-weight: 700; color: #111; text-decoration: none; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .btn { padding: 7px 16px; border-radius: 999px; border: 1px solid #e5e5e5; background: white; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s; color: #666; }
    .btn:hover { background: #f5f5f5; color: #111; }
    .btn-primary { background: #111; color: white; border-color: #111; }
    .btn-primary:hover { opacity: 0.85; background: #111; color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    /* Two-column layout */
    main { display: flex; gap: 24px; max-width: 1400px; margin: 0 auto; padding: 24px; min-height: calc(100vh - 56px); }
    .editor-area { flex: 7; min-width: 0; }
    .sidebar-area { flex: 3; min-width: 280px; max-width: 360px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .content-label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .content-label-row label { margin-bottom: 0; }
    .slug-row { display: flex; gap: 8px; align-items: center; }
    .slug-row input { flex: 1; }
    .slug-preview { font-size: 12px; color: #9ca3af; }
    input[type="text"], textarea, select {
      width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px;
      font-size: 15px; font-family: inherit; transition: border-color 0.2s;
    }
    input[type="text"]:focus, textarea:focus, select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    textarea#content { min-height: calc(100vh - 180px); font-family: 'SF Mono', 'Consolas', monospace; font-size: 14px; line-height: 1.7; resize: vertical; }
    textarea#excerpt { min-height: 80px; resize: vertical; }
    .tags-input-container { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .tag-chip { display: inline-flex; align-items: center; gap: 4px; background: #eff6ff; color: #1e40af; padding: 4px 10px; border-radius: 16px; font-size: 13px; }
    .tag-chip button { background: none; border: none; cursor: pointer; color: #1e40af; font-size: 14px; line-height: 1; padding: 0; }
    .tag-chip button:hover { color: #1d4ed8; }
    .char-count { font-size: 12px; color: #9ca3af; text-align: right; margin-top: 4px; }
    .help-text { font-size: 12px; color: #9ca3af; margin-top: 4px; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1c1917; color: white; padding: 10px 24px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 200; }
    .toast.show { opacity: 1; }
    .preview-toggle { display: flex; gap: 4px; }
    .preview-toggle button { padding: 7px 12px; border-radius: 8px; border: 1px solid #d1d5db; background: white; cursor: pointer; font-size: 13px; }
    .preview-toggle button.active { background: #eff6ff; color: #1e40af; border-color: #bfdbfe; }

    /* Preview content styling */
    .preview-content { font-size: 15px; line-height: 1.7; color: #333; }
    .preview-content h1, .preview-content h2, .preview-content h3 { margin: 20px 0 10px; font-weight: 700; color: #111; }
    .preview-content h1 { font-size: 22px; }
    .preview-content h2 { font-size: 18px; }
    .preview-content h3 { font-size: 16px; }
    .preview-content p { margin-bottom: 14px; }
    .preview-content code { background: #f5f5f5; padding: 2px 6px; border-radius: 4px; font-size: 13px; font-family: 'SF Mono', 'Consolas', monospace; }
    .preview-content pre { background: #1e1e1e; border-radius: 10px; overflow: hidden; margin: 14px 0; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
    .preview-content pre code { background: none; padding: 0; color: #d4d4d4; font-size: 13px; }
    .preview-content blockquote { border-left: 3px solid #ddd; padding: 8px 14px; background: #fafafa; margin: 14px 0; border-radius: 0 6px 6px 0; color: #555; }
    .preview-content ul, .preview-content ol { padding-left: 22px; margin-bottom: 14px; }
    .preview-content li { margin-bottom: 4px; }
    .preview-content a { color: #0066cc; }
    .preview-content img { max-width: 100%; border-radius: 6px; margin: 14px 0; }
    .preview-content table { border-collapse: collapse; width: 100%; margin: 14px 0; }
    .preview-content th, .preview-content td { border: 1px solid #e5e5e5; padding: 8px 12px; text-align: left; }
    .preview-content th { background: #fafafa; }

    /* Mac-style code blocks via marked */
    .preview-content pre { position: relative; padding-top: 38px; }
    .preview-content pre::before { content: ''; position: absolute; top: 0; left: 0; right: 0; background: #2d2d2d; height: 38px; border-radius: 10px 10px 0 0; display: flex; align-items: center; padding: 0 14px; gap: 6px; }
    .preview-content .mac-dots { position: absolute; top: 12px; left: 14px; display: flex; gap: 6px; z-index: 1; }
    .preview-content .mac-dots span { width: 12px; height: 12px; border-radius: 50%; }
    .preview-content .mac-dots span.red { background: #ff5f56; }
    .preview-content .mac-dots span.yellow { background: #ffbd2e; }
    .preview-content .mac-dots span.green { background: #27c93f; }
    .preview-content pre code { padding: 14px 16px; display: block; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 13px; line-height: 1.6; color: #d4d4d4; overflow-x: auto; white-space: pre; }
    .status-row { display: flex; gap: 12px; align-items: center; }
    .status-row select { width: auto; min-width: 120px; }

    /* Image upload styles */
    .editor-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .upload-btn { padding: 6px 14px; border-radius: 6px; border: 1px solid #d1d5db; background: white; cursor: pointer; font-size: 13px; color: #666; display: flex; align-items: center; gap: 4px; }
    .upload-btn:hover { background: #f5f5f5; color: #111; }
    .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .upload-btn svg { width: 14px; height: 14px; }
    #content.drag-over { border-color: #3b82f6 !important; background: #eff6ff !important; }
    .upload-progress { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: #eff6ff; border-radius: 16px; font-size: 12px; color: #1e40af; }
    .upload-progress .spinner { width: 12px; height: 12px; border: 2px solid #bfdbfe; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Sidebar card */
    .sidebar-card { background: #fafafa; border: 1px solid #e5e5e5; border-radius: 12px; padding: 20px; position: sticky; top: 80px; }

    @media (max-width: 900px) {
      main { flex-direction: column-reverse; padding: 16px; }
      .sidebar-area { width: 100%; max-width: 100%; min-width: unset; }
      .sidebar-card { position: static; }
      .editor-area { width: 100%; }
      textarea#content { min-height: 400px; }
    }

    @media (max-width: 640px) {
      main { padding: 12px; }
      header { padding: 0 12px; }
      .header-inner { max-width: 100%; gap: 8px; padding: 0; }
      .header-actions { gap: 6px; }
      .header-actions .btn, .preview-toggle button { padding: 6px 10px; font-size: 12px; }
      #title { font-size: 18px; }
      #content { min-height: 300px; font-size: 14px; }
      textarea, input[type="text"] { font-size: 14px; }
      .preview-content pre code { font-size: 12px; padding: 12px; }
      .preview-content pre { padding-top: 36px; }
      .sidebar-card { padding: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="javascript:history.back()" class="btn back-btn">← 返回</a>
      <div class="header-actions">
        <button class="btn" id="draftBtn" onclick="savePost('draft')">保存草稿</button>
        <button class="btn btn-primary" id="publishBtn" onclick="savePost('published')">发布</button>
      </div>
    </div>
  </header>

  <main>
    <!-- Left: Editor area (70%) -->
    <div class="editor-area">
      <div class="form-group">
        <div class="content-label-row">
          <label>正文 *</label>
          <div class="preview-toggle">
            <button class="active" id="writeBtn" onclick="setMode('write')">编写</button>
            <button id="previewBtn" onclick="setMode('preview')">预览</button>
          </div>
        </div>
        <div class="editor-toolbar">
          <button class="upload-btn" id="imageUploadBtn" onclick="document.getElementById('imageFileInput').click()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            上传图片
          </button>
          <span id="uploadStatus"></span>
          <input type="file" id="imageFileInput" accept="image/jpeg,image/png,image/gif,image/webp" style="display:none" onchange="handleFileSelect(event)">
        </div>
        <textarea id="content" placeholder="使用 Markdown 编写文章内容..."></textarea>
        <div id="previewContainer" class="markdown-body" style="display:none; padding:16px; background:#fafafa; border-radius:8px; min-height:200px;"></div>
      </div>
    </div>

    <!-- Right: Sidebar area (30%) -->
    <div class="sidebar-area">
      <div class="sidebar-card">
        <div class="form-group">
          <label>标题 *</label>
          <input type="text" id="title" placeholder="输入文章标题..." maxlength="200" oninput="updateSlug()">
        </div>

        <div class="form-group">
          <label>URL Slug</label>
          <div class="slug-row">
            <input type="text" id="slug" placeholder="可选，留空自动使用序号" data-user-edited="false">
            <span class="slug-preview">/posts/</span>
          </div>
          <p class="help-text">留空则根据标题自动生成</p>
        </div>

        <div class="form-group">
          <label>摘要</label>
          <textarea id="excerpt" placeholder="文章的简短描述（可选），用于列表页展示..." maxlength="300"></textarea>
          <div class="char-count"><span id="excerptCount">0</span>/300</div>
        </div>

        <div class="form-group">
          <label>标签</label>
          <div class="tags-input-container">
            <div id="tagChips"></div>
            <input type="text" id="tagInput" placeholder="输入标签后按回车添加" style="width: 140px; padding: 6px 10px; font-size: 13px;" onkeydown="handleTagKeydown(event)">
          </div>
          <p class="help-text">按回车添加标签，最多5个</p>
        </div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    // Login guard: redirect to login if not authenticated
    (function() {
      const session = localStorage.getItem('cloudblog_session');
      if (!session) {
        const returnUrl = encodeURIComponent(window.location.pathname + window.location.search);
        window.location.href = '/admin/login.html?return_url=' + returnUrl;
        return;
      }
    })();

    let currentTags = [];
    let currentMode = 'write';
    let isSaving = false;
    let editSlug = null;
    let isNewPost = false; // Track if creating new post vs editing existing

    // Check if editing existing post (by editNum, editId, or editSlug)
    (function checkEditMode() {
      const params = new URLSearchParams(window.location.search);
      const editNum = params.get('editNum');
      const editId = params.get('editId');
      const editSlug = params.get('edit');

      if (editNum) {
        // New way: edit by sequential number
        isNewPost = false;
        document.title = '编辑文章 - CloudBlog';
        const backBtn = document.querySelector('header .btn');
        if (backBtn) backBtn.textContent = '← 返回';
        loadPostByNum(editNum);
      } else if (editId) {
        // Legacy way: edit by internal ID
        isNewPost = false;
        document.title = '编辑文章 - CloudBlog';
        const backBtn = document.querySelector('header .btn');
        if (backBtn) backBtn.textContent = '← 返回';
        loadPostById(editId);
      } else if (editSlug) {
        // Legacy way: edit by slug (for backward compatibility)
        editSlug = decodeURIComponent(editSlug);
        isNewPost = false;
        document.title = '编辑文章 - CloudBlog';
        const backBtn = document.querySelector('header .btn');
        if (backBtn) backBtn.textContent = '← 返回';
        loadPostForEdit(editSlug);
      } else {
        // New article: slug starts empty, backend will assign post_num on save
        isNewPost = true;
      }
    })();

    async function loadPostForEdit(slug) {
      try {
        const res = await fetch(`/api/posts/${encodeURIComponent(slug)}`);
        if (res.ok) {
          const post = await res.json();
          document.getElementById('title').value = post.title || '';
          document.getElementById('slug').value = post.slug || '';
          document.getElementById('content').value = post.content || '';
          document.getElementById('excerpt').value = post.excerpt || '';
          document.getElementById('excerptCount').textContent = (post.excerpt || '').length;
          currentTags = post.tags || [];
          renderTags();
        } else {
          showToast('加载文章失败');
        }
      } catch (e) {
        showToast('加载文章失败');
      }
    }

    async function loadPostById(id) {
      try {
        const res = await fetch(`/api/admin/posts/by-id/${encodeURIComponent(id)}`);
        if (res.ok) {
          const post = await res.json();
          document.getElementById('title').value = post.title || '';
          document.getElementById('slug').value = post.slug || '';
          document.getElementById('slug').dataset.userEdited = 'true'; // Don't auto-overwrite
          document.getElementById('content').value = post.content || '';
          document.getElementById('excerpt').value = post.excerpt || '';
          document.getElementById('excerptCount').textContent = (post.excerpt || '').length;
          currentTags = post.tags || [];
          renderTags();
          editSlug = post.slug;
        } else {
          showToast('加载文章失败');
        }
      } catch (e) {
        showToast('加载文章失败');
      }
    }

    async function loadPostByNum(num) {
      try {
        const res = await fetch(`/api/admin/posts/by-num/${encodeURIComponent(num)}`);
        if (res.ok) {
          const post = await res.json();
          document.getElementById('title').value = post.title || '';
          document.getElementById('slug').value = post.slug || '';
          document.getElementById('slug').dataset.userEdited = 'true'; // Don't auto-overwrite
          document.getElementById('content').value = post.content || '';
          document.getElementById('excerpt').value = post.excerpt || '';
          document.getElementById('excerptCount').textContent = (post.excerpt || '').length;
          currentTags = post.tags || [];
          renderTags();
          editSlug = post.slug;
        } else {
          showToast('加载文章失败');
        }
      } catch (e) {
        showToast('加载文章失败');
      }
    }

    function updateSlug() {
      // Slug is manually entered, no auto-generation
    }

    // Chinese character to pinyin mapping (common characters)

    document.getElementById('excerpt').addEventListener('input', function() {
      document.getElementById('excerptCount').textContent = this.value.length;
    });

    function handleTagKeydown(e) {
      if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault();
        addTag(e.target.value.replace(/,$/, '').trim());
        e.target.value = '';
      }
    }

    function addTag(name) {
      name = name.trim();
      if (!name || currentTags.includes(name) || currentTags.length >= 5) return;
      currentTags.push(name);
      renderTags();
    }

    function removeTag(name) {
      currentTags = currentTags.filter(t => t !== name);
      renderTags();
    }

    function renderTags() {
      document.getElementById('tagChips').innerHTML = currentTags.map(t =>
        `<span class="tag-chip">${escapeHtml(t)}<button onclick="removeTag('${escapeHtml(t)}')">×</button></span>`
      ).join('');
    }

    async function savePost(status) {
      if (isSaving) return;
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value.trim();
      if (!title || !content) {
        showToast('标题和内容不能为空');
        return;
      }

      isSaving = true;
      document.getElementById('publishBtn').disabled = true;
      document.getElementById('draftBtn').disabled = true;

      const slug = document.getElementById('slug').value.trim() || undefined;
      // Validate slug: must be ASCII only (no Chinese characters)
      if (slug && /[^\x00-\x7F]/.test(slug)) {
        isSaving = false;
        document.getElementById('publishBtn').disabled = false;
        document.getElementById('draftBtn').disabled = false;
        showToast('URL Slug 不能包含中文，请使用英文或数字');
        return;
      }
      const excerpt = document.getElementById('excerpt').value.trim() || undefined;

      try {
        let res, data;
        if (editSlug) {
          // Update existing post
          res = await fetch(`/api/posts/${encodeURIComponent(editSlug)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ title, slug, content, excerpt, status, tags: currentTags })
          });
        } else {
          // Create new post
          res = await fetch('/api/posts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ title, slug, content, excerpt, status, tags: currentTags })
          });
        }

        if (res.ok) {
          data = await res.json();
          showToast(status === 'published' ? '发布成功！' : '草稿已保存');
          if (status === 'published') {
            const redirectSlug = data.slug || editSlug;
            setTimeout(() => { window.location.href = `/posts/${redirectSlug}`; }, 800);
          } else {
            // Draft saved - update URL with edit slug if new, stay on page
            if (data.slug && !editSlug) {
              history.replaceState(null, '', `?edit=${encodeURIComponent(data.slug)}`);
              editSlug = data.slug; // Update the global so future saves use PUT
            }
            // Stay on write page after draft save
          }
        } else if (res.status === 401) {
          showToast('请先登录');
          setTimeout(() => { window.location.href = '/admin/login.html'; }, 1500);
        } else {
          const err = await res.json();
          showToast(err.error || '保存失败');
        }
      } catch (e) {
        showToast('保存失败: ' + e.message);
      } finally {
        isSaving = false;
        document.getElementById('publishBtn').disabled = false;
        document.getElementById('draftBtn').disabled = false;
      }
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('writeBtn').classList.toggle('active', mode === 'write');
      document.getElementById('previewBtn').classList.toggle('active', mode === 'preview');
      const textarea = document.getElementById('content');
      const preview = document.getElementById('previewContainer');
      if (mode === 'preview') {
        textarea.style.display = 'none';
        preview.style.display = 'block';
        preview.innerHTML = renderMarkdown(textarea.value);
      } else {
        textarea.style.display = 'block';
        preview.style.display = 'none';
      }
    }

    // Use marked.js for proper markdown rendering
    function renderMarkdown(content) {
      if (!content) return '<p style="color:#999">暂无内容</p>';
      marked.setOptions({
        breaks: true,
        gfm: true,
      });
      let html = marked.parse(content);
      // Add mac-style dots to code blocks
      html = html.replace(/<pre><code(?: class="language-(\w+)")?>/g, (_, lang) => {
        const label = lang || 'code';
        return `<pre><div class="mac-dots"><span class="red"></span><span class="yellow"></span><span class="green"></span></div><code class="language-${label}">`;
      });
      return `<div class="preview-content">${html}</div>`;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // Ctrl+S to save draft
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        savePost('draft');
      }
    });

    // ========== Image Upload Feature ==========
    const contentArea = document.getElementById('content');
    const uploadBtn = document.getElementById('imageUploadBtn');
    const uploadStatus = document.getElementById('uploadStatus');
    const imageFileInput = document.getElementById('imageFileInput');

    // Drag and drop on textarea
    contentArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.stopPropagation();
      contentArea.classList.add('drag-over');
    });

    contentArea.addEventListener('dragleave', (e) => {
      e.preventDefault();
      e.stopPropagation();
      contentArea.classList.remove('drag-over');
    });

    contentArea.addEventListener('drop', async (e) => {
      e.preventDefault();
      e.stopPropagation();
      contentArea.classList.remove('drag-over');

      const files = e.dataTransfer?.files;
      if (files && files.length > 0) {
        await uploadAndInsertImage(files[0]);
      }
    });

    // Paste image from clipboard
    contentArea.addEventListener('paste', async (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;

      for (const item of items) {
        if (item.type.startsWith('image/')) {
          e.preventDefault();
          const file = item.getAsFile();
          if (file) {
            await uploadAndInsertImage(file);
          }
          return;
        }
      }
    });

    // File input click handler
    function handleFileSelect(event) {
      const file = event.target.files?.[0];
      if (file) {
        uploadAndInsertImage(file);
      }
      // Reset input so same file can be selected again
      event.target.value = '';
    }

    // Upload image and insert markdown at cursor position
    let isUploading = false;

    async function uploadAndInsertImage(file) {
      if (isUploading) {
        showToast('正在上传中，请稍候');
        return;
      }

      // Validate file type
      const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif', 'image/webp'];
      if (!allowedTypes.includes(file.type)) {
        showToast('不支持的图片格式，请使用 jpg、png、gif 或 webp');
        return;
      }

      // Validate file size (5MB)
      if (file.size > 5 * 1024 * 1024) {
        showToast('图片太大，请选择 5MB 以内的图片');
        return;
      }

      isUploading = true;
      uploadBtn.disabled = true;
      uploadStatus.innerHTML = '<span class="upload-progress"><span class="spinner"></span>上传中...</span>';

      try {
        const formData = new FormData();
        formData.append('file', file);

        const res = await fetch('/api/upload/image', {
          method: 'POST',
          credentials: 'include',
          body: formData,
        });

        if (res.status === 401) {
          showToast('请先登录');
          setTimeout(() => { window.location.href = '/admin/login.html'; }, 1500);
          return;
        }

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.message || '上传失败');
        }

        const data = await res.json();
        const imageUrl = data.data.url;

        // Insert markdown image syntax at cursor position
        const mdImage = `![${file.name}](${imageUrl})`;
        insertTextAtCursor(mdImage);

        showToast('图片上传成功');
      } catch (err) {
        showToast('上传失败: ' + err.message);
      } finally {
        isUploading = false;
        uploadBtn.disabled = false;
        uploadStatus.innerHTML = '';
      }
    }

    // Insert text at cursor position in textarea
    function insertTextAtCursor(text) {
      const textarea = contentArea;
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const before = textarea.value.substring(0, start);
      const after = textarea.value.substring(end);

      textarea.value = before + text + after;
      textarea.selectionStart = textarea.selectionEnd = start + text.length;
      textarea.focus();

      // Trigger input event for any listeners
      textarea.dispatchEvent(new Event('input', { bubbles: true }));
    }
  </script>
</body>
</html>
