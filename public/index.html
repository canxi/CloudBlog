<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="A modern edge blog powered by Cloudflare Workers">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>CloudBlog</title>
  <!-- --完成: 首页极简设计 - 无图标，简洁设计，完美适配移动端 -->
  <style>
    :root {
      --primary: #111;
      --text: #111;
      --text-secondary: #666;
      --bg: #fff;
      --surface: #fff;
      --border: #e5e5e5;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      line-height: 1.6; -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    header {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 56px;
      display: flex; align-items: center; justify-content: center;
      position: sticky; top: 0; z-index: 100;
    }
    .header-inner {
      width: 100%;
      max-width: 680px;
      display: flex; align-items: center; justify-content: center;
    }
    .header-centered {
      display: flex; align-items: center; gap: 16px;
    }
    .header-brand { font-size: 16px; font-weight: 700; color: var(--text); text-decoration: none; letter-spacing: -0.3px; }
    .header-nav { display: flex; align-items: center; gap: 6px; }
    .header-nav a {
      color: var(--text-secondary); text-decoration: none; font-size: 13px;
      padding: 6px 14px; border-radius: 999px; transition: all 0.15s; font-weight: 500;
    }
    .header-nav a:hover { background: #f5f5f5; color: var(--text); }
    .btn-write {
      background: var(--primary) !important; color: white !important;
      padding: 6px 14px !important; border-radius: 999px !important;
      font-weight: 600 !important; font-size: 13px !important;
    }
    .btn-write:hover { opacity: 0.8 !important; background: var(--primary) !important; }
    .btn-write:hover { opacity: 0.85 !important; }

    /* ── Main ── */
    main { max-width: 680px; margin: 0 auto; padding: 32px 20px 80px; }

    /* ── Post List ── */
    .posts-list { display: flex; flex-direction: column; }
    .post-item {
      padding: 24px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .post-item:last-child { border-bottom: none; }
    .post-item:hover .post-title { color: #666; }
    .post-title {
      font-size: 17px; font-weight: 600; color: var(--text); line-height: 1.4;
      margin-bottom: 8px; letter-spacing: -0.2px; transition: color 0.15s;
    }
    .post-meta { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .post-meta span { white-space: nowrap; }
    .post-excerpt { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--text-secondary);
    }
    .empty-state h3 { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .empty-state p { font-size: 13px; }
    .empty-btn { display: inline-block; margin-top: 16px; padding: 8px 20px; background: var(--primary); color: white; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 600; }
    .empty-btn:hover { opacity: 0.85; }

    /* ── Loading Skeleton ── */
    .skeleton-item { padding: 24px 0; border-bottom: 1px solid var(--border); }
    .skeleton-item:last-child { border-bottom: none; }
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skel-title { height: 18px; width: 55%; margin-bottom: 10px; }
    .skel-meta { height: 12px; width: 30%; }

    /* ── Footer ── */
    footer { border-top: 1px solid var(--border); padding: 24px 20px; margin-top: 40px; }
    .footer-inner { max-width: 680px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--text-secondary); }
    .footer-links { display: flex; gap: 16px; }
    .footer-links a { color: var(--text-secondary); text-decoration: none; }
    .footer-links a:hover { color: var(--text); }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #111; color: white; padding: 10px 20px; border-radius: 8px;
      font-size: 13px; font-weight: 500; opacity: 0; transition: opacity 0.3s;
      pointer-events: none; z-index: 200; white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    /* ── Post Detail ── */
    .post-detail { max-width: 100%; }
    .post-detail-header { margin-bottom: 28px; }
    .post-detail-title { font-size: clamp(20px, 5vw, 26px); font-weight: 700; color: var(--text); line-height: 1.3; margin-bottom: 14px; letter-spacing: -0.3px; }
    .post-detail-meta { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .post-detail-content { font-size: 15px; line-height: 1.8; color: var(--text); }
    .post-detail-content p { margin-bottom: 14px; }
    .post-detail-content h1, .post-detail-content h2, .post-detail-content h3 { margin: 22px 0 10px; font-weight: 700; }
    .post-detail-content h2 { font-size: 18px; }
    .post-detail-content h3 { font-size: 16px; }
    .post-detail-content code { background: #f5f5f5; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
    .post-detail-content pre { background: #1a1a1a; color: #e5e5e5; padding: 14px; border-radius: 8px; overflow-x: auto; margin: 14px 0; }
    .post-detail-content pre code { background: none; padding: 0; color: inherit; font-size: 13px; }
    .post-detail-content blockquote { border-left: 3px solid var(--border); padding: 10px 14px; background: #fafafa; margin: 14px 0; border-radius: 0 6px 6px 0; }
    .post-detail-content a { color: #0066cc; }
    .post-detail-content img { max-width: 100%; border-radius: 6px; margin: 14px 0; }
    .post-detail-content ul, .post-detail-content ol { padding-left: 22px; margin-bottom: 14px; }
    .post-detail-content li { margin-bottom: 4px; }
    .post-detail-footer { margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--border); }
    .back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: #f5f5f5; border: none; border-radius: 6px; color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
    .back-btn:hover { background: #eee; color: var(--text); }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-centered">
      <a href="/" class="header-brand">CloudBlog</a>
      <nav class="header-nav">
        <a href="/" id="navHome">首页</a>
        <a href="/write.html" class="btn-write" onclick="return goWrite(event)">写文章</a>
        <a href="/admin/index.html" id="navAdmin" style="display:none">管理</a>
      </nav>
    </div>
  </div>
</header>

<main id="mainContent">
  <div class="posts-list" id="skeleton">
    <div class="skeleton-item"><div class="skeleton skel-title"></div><div class="skeleton skel-meta"></div></div>
    <div class="skeleton-item"><div class="skeleton skel-title"></div><div class="skeleton skel-meta"></div></div>
    <div class="skeleton-item"><div class="skeleton skel-title"></div><div class="skeleton skel-meta"></div></div>
  </div>
  <div class="posts-list" id="postsList" style="display:none"></div>
  <div class="empty-state" id="emptyState" style="display:none">
    <h3>还没有文章</h3>
    <p>开始创作你的第一篇文章吧</p>
    <a href="/write.html" class="empty-btn" onclick="return goWrite(event)">写文章</a>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <span>CloudBlog</span>
    <div class="footer-links">
      <a href="/write.html" onclick="return goWrite(event)">写文章</a>
      <a href="/" onclick="return goHome(event)">首页</a>
    </div>
    <span>Powered by Cloudflare Workers</span>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script>
  // ── Router ──
  function getRoute() {
    const path = window.location.pathname;
    if (path === '/') return { page: 'home' };
    const match = path.match(/^\/posts\/([^/]+)$/);
    if (match) return { page: 'post', slug: match[1] };
    return { page: 'home' };
  }

  // ── Load posts ──
  async function loadPosts() {
    try {
      const res = await fetch('/api/posts');
      if (!res.ok) throw new Error('Failed');
      const data = await res.json();
      const posts = Array.isArray(data) ? data : (data.posts || []);

      document.getElementById('skeleton').style.display = 'none';

      if (posts.length === 0) {
        document.getElementById('emptyState').style.display = 'block';
        return;
      }

      renderPosts(posts);
      document.getElementById('postsList').style.display = 'flex';
    } catch (e) {
      document.getElementById('skeleton').innerHTML = `
        <div class="empty-state">
          <h3>加载失败</h3>
          <p>请检查网络连接后刷新</p>
          <button class="empty-btn" onclick="loadPosts()">重试</button>
        </div>`;
    }
  }

  // ── Load single post ──
  async function loadPost(slug) {
    const main = document.getElementById('mainContent');
    main.innerHTML = `<div style="text-align:center;padding:60px;color:#999;font-size:14px;">加载中...</div>`;

    try {
      const res = await fetch(`/api/posts/${encodeURIComponent(slug)}`);
      if (!res.ok) throw new Error('Post not found');
      const post = await res.json();
      renderPost(post);
    } catch (e) {
      main.innerHTML = `
        <div class="empty-state">
          <h3>文章不存在或已被删除</h3>
          <p><a href="/" class="empty-btn" style="margin-top:12px;">返回首页</a></p>
        </div>`;
    }
  }

  // ── Render post ──
  function renderPost(post) {
    const main = document.getElementById('mainContent');
    main.innerHTML = `
      <div class="post-detail">
        <div class="post-detail-header">
          <h1 class="post-detail-title">${escapeHtml(post.title)}</h1>
          <div class="post-detail-meta">
            <span>${escapeHtml(post.author?.name || 'Anonymous')}</span>
            <span>·</span>
            <span>${formatDate(post.publishedAt)}</span>
            <span>·</span>
            <span>${estimateReadTime(post.content)} 分钟</span>
          </div>
        </div>
        <div class="post-detail-content">${simpleMarkdown(post.content)}</div>
        <div class="post-detail-footer">
          <button class="back-btn" onclick="history.back()">← 返回</button>
        </div>
      </div>`;
    document.getElementById('navHome').style.display = '';
  }

  // ── Simple markdown converter ──
  function simpleMarkdown(text) {
    if (!text) return '';
    return escapeHtml(text)
      .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^# (.+)$/gm, '<h1>$1</h1>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">')
      .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
      .split(/\n\n+/)
      .map(p => {
        p = p.trim();
        if (!p) return '';
        if (p.startsWith('<h') || p.startsWith('<pre') || p.startsWith('<blockquote')) return p;
        if (p.startsWith('<ol') || p.startsWith('<ul')) return p;
        return `<p>${p.replace(/\n/g, '<br>')}</p>`;
      })
      .join('\n');
  }

  function renderPosts(posts) {
    const container = document.getElementById('postsList');
    container.innerHTML = posts.map(post => `
      <a href="/posts/${post.slug}" class="post-item" style="text-decoration:none;color:inherit;">
        <div class="post-title">${escapeHtml(post.title)}</div>
        <div class="post-meta">
          <span>${escapeHtml(post.author?.name || 'Anonymous')}</span>
          <span>·</span>
          <span>${formatDate(post.publishedAt)}</span>
          <span>·</span>
          <span>${estimateReadTime(post.content)} 分钟</span>
        </div>
        ${post.excerpt ? `<div class="post-excerpt">${escapeHtml(post.excerpt)}</div>` : ''}
      </a>
    `).join('');
  }

  function estimateReadTime(content) {
    if (!content) return 1;
    return Math.max(1, Math.ceil(content.trim().split(/\s+/).length / 200));
  }

  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function formatDate(ts) {
    if (!ts) return '';
    const d = new Date(ts * (ts > 1e12 ? 1 : 1000));
    return d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'short', day: 'numeric' });
  }

  // ── Write guard ──
  function goWrite(e) {
    if (e && e.preventDefault) e.preventDefault();
    const session = localStorage.getItem('cloudblog_session');
    if (!session) {
      window.location.href = '/admin/login.html?return_url=' + encodeURIComponent(window.location.pathname);
      return false;
    }
    window.location.href = '/write.html';
    return false;
  }

  function goHome(e) {
    if (e && e.preventDefault) e.preventDefault();
    window.location.href = '/';
    return false;
  }

  // ── Init ──
  async function init() {
    // Show admin link if logged in
    if (localStorage.getItem('cloudblog_session')) {
      document.getElementById('navAdmin').style.display = '';
    }

    const route = getRoute();
    if (route.page === 'post') {
      document.getElementById('navHome').style.display = '';
      await loadPost(route.slug);
    } else {
      await loadPosts();
    }
  }

  init();
</script>
</body>
</html>
