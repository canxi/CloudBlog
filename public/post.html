<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CloudBlog Article">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/github-markdown.min.css">
  <script src="/marked.min.js"></script>
  <style>
    :root {
      --primary: #111;
      --bg: #ffffff;
      --surface: #ffffff;
      --text: #111;
      --text-secondary: #666;
      --border: #e5e5e5;
      --code-bg: #f5f5f5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      line-height: 1.6;
    }
    a { color: var(--text); text-decoration: none; }

    /* ── Header ── */
    header {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 56px;
      display: flex; align-items: center; justify-content: center;
      position: sticky; top: 0; z-index: 100;
    }
    .header-inner {
      width: 100%;
      max-width: 680px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-brand { font-size: 16px; font-weight: 700; color: var(--text); text-decoration: none; letter-spacing: -0.3px; }
    .header-nav { display: flex; align-items: center; gap: 6px; }
    .header-nav a {
      color: var(--text-secondary); text-decoration: none; font-size: 13px;
      padding: 6px 14px; border-radius: 999px; transition: all 0.15s; font-weight: 500;
    }
    .header-nav a:hover { background: #f5f5f5; color: var(--text); }
    .btn-write {
      background: var(--primary) !important; color: white !important;
      padding: 6px 14px !important; border-radius: 999px !important;
      font-weight: 600 !important; font-size: 13px !important;
    }
    .btn-write:hover { opacity: 0.8 !important; background: var(--primary) !important; }

    /* ── Article ── */
    article { max-width: 680px; margin: 0 auto; padding: 40px 20px 80px; }
    .article-header { margin-bottom: 28px; }
    .article-title { font-size: clamp(20px, 5vw, 26px); font-weight: 700; line-height: 1.3; margin-bottom: 14px; color: var(--text); letter-spacing: -0.3px; }
    .article-meta { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-secondary); flex-wrap: wrap; }
    .edit-link { color: #fff; background: #111; padding: 3px 10px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: 500; display: inline-block; }
    .edit-link:hover { background: #333; }
    .article-cover { width: 100%; max-height: 400px; object-fit: cover; border-radius: 8px; margin-bottom: 28px; }
    .article-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .tag {
      font-size: 12px; padding: 4px 10px; border-radius: 999px;
      background: #f5f5f5; color: var(--text-secondary); font-weight: 500;
    }
    .article-body { font-size: 15px; line-height: 1.8; }
    .article-body .markdown-body img { max-width: 100%; border-radius: 6px; margin: 14px 0; }
    .article-body .markdown-body pre { background: #1e1e1e; color: #d4d4d4; border-radius: 10px; overflow: hidden; margin: 14px 0; box-shadow: 0 2px 12px rgba(0,0,0,0.15); position: relative; padding-top: 38px; }
    .article-body .markdown-body code { font-family: 'SF Mono', 'Consolas', monospace; font-size: 13px; background: #f5f5f5; padding: 2px 6px; border-radius: 4px; }
    .article-body .markdown-body pre code { background: none; padding: 14px 16px; display: block; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 13px; line-height: 1.6; color: #d4d4d4; overflow-x: auto; white-space: pre; border-radius: 0; }
    .article-body .markdown-body .mac-dots { position: absolute; top: 12px; left: 14px; display: flex; gap: 6px; }
    .article-body .markdown-body .mac-dots span { width: 12px; height: 12px; border-radius: 50%; }
    .article-body .markdown-body .mac-dots span.red { background: #ff5f56; }
    .article-body .markdown-body .mac-dots span.yellow { background: #ffbd2e; }
    .article-body .markdown-body .mac-dots span.green { background: #27c93f; }
    .article-body .markdown-body blockquote { border-left: 3px solid var(--border); padding: 10px 14px; background: #fafafa; margin: 14px 0; border-radius: 0 6px 6px 0; }

    /* ── Comments ── */
    .comments-section { margin-top: 48px; padding-top: 32px; border-top: 1px solid var(--border); }
    .comments-title { font-size: 18px; font-weight: 700; margin-bottom: 24px; }
    .comment-form { margin-bottom: 32px; }
    .comment-form h4 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    .comment-input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; resize: vertical; min-height: 80px; margin-bottom: 8px; }
    .comment-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .comment-meta { display: flex; gap: 8px; margin-bottom: 8px; }
    .comment-meta input { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
    .comment-meta input:focus { outline: none; border-color: var(--primary); }
    .btn { padding: 8px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .comments-list { display: flex; flex-direction: column; gap: 16px; }
    .comment-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .comment-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .comment-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--code-bg); }
    .comment-author { font-weight: 600; font-size: 14px; }
    .comment-date { font-size: 12px; color: var(--text-secondary); margin-left: auto; }
    .comment-content { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
    .comment-status { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 8px; }
    .comment-status.pending { background: #fef3c7; color: #92400e; }
    .comment-status.spam { background: #fee2e2; color: #991b1b; }

    /* ── Loading/Error/Empty ── */
    .loading { text-align: center; padding: 80px 20px; color: var(--text-secondary); }
    .error-state { text-align: center; padding: 80px 20px; }
    .error-state h3 { margin-bottom: 8px; }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }

    /* ── Toast ── */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #0f172a; color: white; padding: 10px 24px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 200; white-space: nowrap; }
    .toast.show { opacity: 1; }

    @media (max-width: 640px) {
      /* Header */
      header { padding: 0 12px !important; height: 50px; }
      .header-inner { max-width: 100% !important; }
      .header-brand { font-size: 15px; }
      .header-nav a { padding: 4px 8px !important; font-size: 12px !important; }
      .btn-write { padding: 4px 10px !important; font-size: 12px !important; }

      /* Article */
      article { padding: 16px 14px 50px !important; }
      .article-header { margin-bottom: 20px; }
      .article-title { font-size: 20px !important; line-height: 1.3; margin-bottom: 10px; }
      .article-meta { font-size: 11px !important; gap: 6px !important; }
      .article-cover { max-height: 200px !important; margin-bottom: 20px; }
      .article-tags { gap: 6px !important; margin-bottom: 14px; }
      .tag { font-size: 11px !important; padding: 3px 8px !important; }
      .article-body { font-size: 14px !important; line-height: 1.7 !important; }

      /* Markdown content */
      .article-body .markdown-body { font-size: 14px !important; }
      .article-body .markdown-body h1 { font-size: 18px !important; }
      .article-body .markdown-body h2 { font-size: 16px !important; }
      .article-body .markdown-body h3 { font-size: 15px !important; }
      .article-body .markdown-body p { margin-bottom: 12px !important; }
      .article-body .markdown-body pre { margin: 12px 0 !important; padding-top: 36px !important; }
      .article-body .markdown-body pre code { font-size: 12px !important; padding: 10px 12px !important; }
      .article-body .markdown-body blockquote { margin: 12px 0 !important; padding: 8px 12px !important; }
      .article-body .markdown-body ul, .article-body .markdown-body ol { padding-left: 18px !important; margin-bottom: 12px !important; }
      .article-body .markdown-body img { margin: 10px 0 !important; }

      /* Comments */
      .comments-section { margin-top: 32px !important; padding-top: 24px !important; }
      .comments-title { font-size: 16px !important; margin-bottom: 16px !important; }
      .comment-form { margin-bottom: 24px !important; }
      .comment-form h4 { font-size: 14px !important; margin-bottom: 10px !important; }
      .comment-input { padding: 10px !important; font-size: 14px !important; min-height: 70px !important; }
      .comment-meta { flex-direction: column !important; gap: 6px !important; }
      .comment-meta input { font-size: 13px !important; padding: 8px 10px !important; }
      .btn { padding: 8px 14px !important; font-size: 13px !important; }
      .comments-list { gap: 10px !important; }
      .comment-item { padding: 12px !important; border-radius: 8px !important; }
      .comment-header { flex-wrap: wrap !important; gap: 6px !important; }
      .comment-author { font-size: 13px !important; }
      .comment-content { font-size: 13px !important; }

      /* Loading/error states */
      .loading, .error-state { padding: 40px 14px !important; }
      .empty-state { padding: 30px 14px !important; }

      /* Toast */
      .toast { padding: 8px 16px !important; font-size: 13px !important; bottom: 16px !important; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="/" class="header-brand">{{SITE_LOGO}}</a>
    <nav class="header-nav">
      <a href="/" id="navHome">首页</a>
      <a href="/write.html" class="btn-write" onclick="return goWrite(event)">写文章</a>
    </nav>
  </div>
</header>

<main>
  <article>
    <!-- Loading -->
    <div id="loading" class="loading">加载中...</div>

    <!-- Error -->
    <div id="error" class="error-state" style="display:none">
      <h3>文章不存在</h3>
      <p style="color:var(--text-secondary);margin:8px 0 16px">找不到这篇文章，可能已被删除或链接错误</p>
      <a href="/" class="btn btn-primary">返回首页</a>
    </div>

    <!-- Article content -->
    <div id="content" style="display:none">
      <div class="article-header">
        <h1 class="article-title" id="title"></h1>
        <div class="article-meta">
          <span id="author"></span>
          <span class="dot"></span>
          <span id="date"></span>
          <span class="dot"></span>
          <span id="readtime"></span>
          <span id="editBtnContainer" style="display:none">
            <span class="dot"></span>
            <a id="editBtn" href="#" class="edit-link">✏️ 编辑</a>
          </span>
        </div>
        <div class="article-tags" id="tags"></div>
      </div>
      <img id="cover" class="article-cover" style="display:none" alt="">
      <div class="article-body">
        <div id="postContent" class="markdown-body"></div>
      </div>

      <!-- Comments -->
      <div class="comments-section">
        <h3 class="comments-title">💬 评论</h3>
        <div class="comment-form" id="commentForm">
          <h4>发表评论</h4>
          <div class="comment-meta">
            <input type="text" id="commentAuthor" placeholder="昵称" maxlength="100">
            <input type="email" id="commentEmail" placeholder="邮箱（不公开）" maxlength="254">
          </div>
          <textarea id="commentContent" class="comment-input" placeholder="写下你的评论..." maxlength="2000"></textarea>
          <button class="btn btn-primary" id="submitComment" onclick="submitComment()">发表评论</button>
        </div>
        <div id="commentsList" class="comments-list"></div>
      </div>
    </div>
  </article>
</main>

<div class="toast" id="toast"></div>

<script>
  // Extract slug from URL path like /posts/my-slug or /posts/123
  function getSlugFromPath() {
    const match = window.location.pathname.match(/^\/posts\/([^\/]+)/);
    return match ? match[1] : null;
  }

  // Check if slug is actually a number (post_num)
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function goWrite(e) {
    if (e && e.preventDefault) e.preventDefault();
    const session = localStorage.getItem('cloudblog_session');
    if (!session) {
      window.location.href = '/admin/login.html?return_url=' + encodeURIComponent(window.location.pathname);
      return false;
    }
    window.location.href = '/write.html';
    return false;
  }

  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function formatDate(ts) {
    if (!ts) return '';
    let d;
    if (typeof ts === 'string' || (typeof ts === 'number' && ts > 1e12)) {
      d = new Date(ts);
    } else {
      d = new Date(ts * 1000);
    }
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function renderMarkdown(content) {
    if (!content) return '';
    marked.setOptions({
      breaks: true,
      gfm: true,
    });
    let html = marked.parse(content);
    // Add mac-style dots to code blocks
    html = html.replace(/<pre><code(?: class="language-(\w+)")?>/g, (_, lang) => {
      const label = lang || 'code';
      return `<pre><div class="mac-dots"><span class="red"></span><span class="yellow"></span><span class="green"></span></div><code class="language-${label}">`;
    });
    return html;
  }

  let currentPost = null;
  let currentSlug = null;

  async function loadPost() {
    const slug = getSlugFromPath();
    if (!slug) {
      showError();
      return;
    }
    currentSlug = slug;

    try {
      // Both numeric (post_num) and text (slug) can use the public /api/posts/:slug endpoint
      const res = await fetch(`/api/posts/${encodeURIComponent(slug)}`);
      if (!res.ok) {
        showError();
        return;
      }
      const post = await res.json();
      currentPost = post;
      renderPost(post);
      loadComments(slug);
    } catch (e) {
      showError();
    }
  }

  function showError() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
  }

  function renderPost(post) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    document.getElementById('title').textContent = post.title;
    document.getElementById('author').textContent = '👤 ' + (post.author?.name || 'Unknown');
    document.getElementById('date').textContent = '📅 ' + formatDate(post.publishedAt || post.createdAt);
    document.getElementById('readtime').textContent = '⏱️ ' + estimateReadTime(post.content) + ' 分钟';
    document.getElementById('postContent').innerHTML = renderMarkdown(post.content);

    if (post.coverImage) {
      const cover = document.getElementById('cover');
      cover.src = post.coverImage;
      cover.style.display = 'block';
    }

    // Tags
    if (post.tags && post.tags.length > 0) {
      document.getElementById('tags').innerHTML = post.tags.map(t =>
        `<span class="tag">${escapeHtml(t.name || t)}</span>`
      ).join('');
    }

    // Update page title
    document.title = post.title + ' - CloudBlog';
    document.querySelector('meta[name="description"]').content = post.excerpt || post.title;

    // Show edit button if user is logged in
    if (localStorage.getItem('cloudblog_session')) {
      const editNum = post.post_num || (post.slug && /^\d+$/.test(post.slug) ? post.slug : null);
      if (editNum) {
        const editBtn = document.getElementById('editBtn');
        const editContainer = document.getElementById('editBtnContainer');
        editBtn.href = `/write.html?editNum=${editNum}`;
        editContainer.style.display = '';
      }
    }
  }

  function estimateReadTime(content) {
    if (!content) return 1;
    const words = content.trim().split(/\s+/).length;
    return Math.max(1, Math.ceil(words / 200));
  }

  async function loadComments(slug) {
    try {
      const res = await fetch(`/api/comments/${encodeURIComponent(slug)}`);
      if (!res.ok) {
        console.error('Comments API error:', res.status);
        return;
      }
      const data = await res.json();
      // API returns array of approved comments directly
      const comments = Array.isArray(data) ? data : (data.comments || []);
      renderComments(comments);
    } catch (e) {
      console.error('Failed to load comments:', e);
    }
  }

  function renderComments(comments) {
    const container = document.getElementById('commentsList');
    if (!comments || comments.length === 0) {
      container.innerHTML = '<div class="empty-state">还没有评论，来抢沙发吧！</div>';
      return;
    }
    container.innerHTML = comments.map(c => `
      <div class="comment-item">
        <div class="comment-header">
          <img src="${c.avatar || 'https://www.gravatar.com/avatar/0?d=identicon&s=80'}" class="comment-avatar" alt="" onerror="this.src='https://www.gravatar.com/avatar/0?d=identicon&s=80'">
          <span class="comment-author">${escapeHtml(c.author)}</span>
          <span class="comment-date">${formatDate(c.createdAt)}</span>
        </div>
        <div class="comment-content">${escapeHtml(c.content)}</div>
      </div>
    `).join('');
  }

  async function submitComment() {
    const author = document.getElementById('commentAuthor').value.trim();
    const email = document.getElementById('commentEmail').value.trim();
    const content = document.getElementById('commentContent').value.trim();

    if (!author || !email || !content) {
      showToast('请填写昵称、邮箱和评论内容');
      return;
    }

    const btn = document.getElementById('submitComment');
    btn.disabled = true;
    btn.textContent = '提交中...';

    try {
      const res = await fetch('/api/comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ postSlug: currentSlug, author, email, content })
      });

      if (res.ok) {
        showToast('评论已提交，等待审核');
        document.getElementById('commentContent').value = '';
      } else {
        const err = await res.json();
        showToast(err.error || '提交失败');
      }
    } catch (e) {
      showToast('网络错误，请重试');
    } finally {
      btn.disabled = false;
      btn.textContent = '发表评论';
    }
  }

  // Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }

  loadPost();
</script>
</body>
</html>
